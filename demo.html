<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kando [Mode Démo] - Gestionnaire Kanban | Logitrack IT</title>
  <meta name="description" content="Version Démo autonome du frontend Kando sans backend requis. Client de test pédagogique B2 DEV.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ========================================================================= -->
  <!-- BARRE SUPÉRIEURE DE NAVIGATION (HEADER)                                   -->
  <!-- ========================================================================= -->
  <header id="app-header" class="app-header hidden">
    <!-- Logo de l'application et Badges -->
    <div class="header-brand">
      <div class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="18" x="3" y="3" rx="2"/>
          <path d="M9 3v18M15 3v18"/>
        </svg>
      </div>
      <div class="brand-info">
        <span class="brand-name">Kando</span>
        <span class="badge badge-brand">Logitrack Internal</span>
        <span class="badge badge-demo" title="Cette version fonctionne de manière autonome avec une base simulée">Mode Démo</span>
      </div>
    </div>

    <!-- Sélecteur de tableaux & Actions globales du tableau -->
    <div class="header-board-controls">
      <div class="board-select-wrapper">
        <svg class="select-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m6 9 6 6 6-6"/>
        </svg>
        <select id="board-select" class="form-select" aria-label="Sélectionner un tableau">
          <option value="">Chargement des tableaux...</option>
        </select>
      </div>

      <button type="button" class="btn btn-secondary btn-sm" id="btn-new-board" title="Créer un nouveau tableau Kanban">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        <span>Nouveau tableau</span>
      </button>

      <button type="button" class="btn btn-danger-outline btn-sm" id="btn-delete-board" title="Supprimer le tableau actif">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2M10 11v6M14 11v6"/>
        </svg>
        <span>Supprimer</span>
      </button>

      <button type="button" class="btn btn-secondary btn-sm" id="btn-reset-demo" title="Réinitialiser les données de démonstration par défaut">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>
        </svg>
        <span>Réinitialiser Démo</span>
      </button>

      <a href="index.html" class="btn btn-secondary btn-sm" title="Basculer vers le client connecté à l'API réelle">
        <span>Mode API Réelle</span>
      </a>
    </div>

    <!-- Menu Utilisateur & Déconnexion -->
    <div class="header-user-menu">
      <div class="user-pill" title="Utilisateur démo connecté">
        <svg class="user-avatar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/>
        </svg>
        <span id="user-display" class="user-display-name">alex_dev</span>
      </div>

      <button type="button" class="btn btn-secondary btn-sm" id="btn-logout" title="Se déconnecter">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
        </svg>
        <span>Déconnexion</span>
      </button>
    </div>
  </header>

  <!-- ========================================================================= -->
  <!-- VUE 1 : AUTHENTIFICATION (SI NON CONNECTÉ)                                 -->
  <!-- ========================================================================= -->
  <main id="auth-view" class="auth-view">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="3" rx="2"/>
            <path d="M9 3v18M15 3v18"/>
          </svg>
        </div>
        <h1 class="auth-title">Kando <span class="badge badge-demo">Démo</span></h1>
        <p class="auth-subtitle">Version autonome sans backend &bull; Logitrack IT</p>
      </div>

      <!-- Bouton d'accès direct démo -->
      <div style="margin-bottom: 20px;">
        <button type="button" class="btn btn-primary btn-block" id="btn-demo-quick-login">
          Accéder directement au tableau (alex_dev)
        </button>
      </div>

      <!-- Onglets de bascule Connexion / Inscription -->
      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab-btn active" id="tab-login-btn" role="tab" aria-selected="true">
          Connexion
        </button>
        <button type="button" class="auth-tab-btn" id="tab-register-btn" role="tab" aria-selected="false">
          Inscription
        </button>
      </div>

      <!-- Formulaire de Connexion -->
      <form id="form-login" class="auth-form" novalidate>
        <div class="form-group">
          <label for="login-email">Adresse e-mail</label>
          <div class="input-with-icon">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>
            <input type="email" id="login-email" class="form-input" value="alex@logitrack.internal" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label for="login-password">Mot de passe</label>
          <div class="input-with-icon">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" id="login-password" class="form-input" value="Password123!" required autocomplete="current-password">
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">
          Se connecter
        </button>
      </form>

      <!-- Formulaire d'Inscription -->
      <form id="form-register" class="auth-form hidden" novalidate>
        <div class="form-group">
          <label for="register-username">Nom d'utilisateur</label>
          <div class="input-with-icon">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/>
            </svg>
            <input type="text" id="register-username" class="form-input" placeholder="alex_dev" required autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label for="register-email">Adresse e-mail</label>
          <div class="input-with-icon">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>
            <input type="email" id="register-email" class="form-input" placeholder="alex@logitrack.internal" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label for="register-password">Mot de passe</label>
          <div class="input-with-icon">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" id="register-password" class="form-input" placeholder="Au moins 6 caractères" minlength="4" required autocomplete="new-password">
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">
          Créer mon compte démo
        </button>
      </form>

      <div class="auth-demo-banner">
        <a href="index.html" class="btn btn-secondary btn-block">
          Passer au mode API réelle (index.html)
        </a>
      </div>
    </div>
  </main>

  <!-- ========================================================================= -->
  <!-- VUE 2 : ESPACE KANBAN                                                     -->
  <!-- ========================================================================= -->
  <main id="kanban-app" class="kanban-app hidden">
    <!-- Sous-barre d'outils du tableau actif (Titre & Recherche bonus intégrée) -->
    <div id="board-sub-bar" class="board-sub-bar">
      <div class="sub-bar-left">
        <h2 id="current-board-title-text" class="current-board-title">Tableau</h2>
      </div>

      <div class="sub-bar-search">
        <div class="search-input-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
          </svg>
          <input
            type="search"
            id="search-cards-input"
            class="search-input"
            placeholder="Filtrer ou rechercher une tâche..."
            aria-label="Rechercher des cartes dans ce tableau">
          <button type="button" id="btn-clear-search" class="search-clear-btn hidden" title="Effacer la recherche" aria-label="Effacer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Conteneur à défilement horizontal des colonnes Kanban -->
    <div id="kanban-columns-container" class="kanban-columns-container" aria-label="Colonnes du tableau Kanban">
      <!-- Les colonnes et cartes seront injectées dynamiquement par board.js -->
    </div>
  </main>

  <!-- ========================================================================= -->
  <!-- FENÊTRES MODALES ACCESSIBLES                                              -->
  <!-- ========================================================================= -->

  <!-- 1. Modale Création de Tableau -->
  <div id="modal-board" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-board-heading">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="modal-board-heading">Nouveau tableau</h3>
        <button type="button" class="btn-close" data-close-modal="modal-board" aria-label="Fermer la boîte de dialogue">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <form id="form-board">
        <div class="modal-body">
          <div class="form-group">
            <label for="board-title-input">Titre du tableau</label>
            <input type="text" id="board-title-input" class="form-input" placeholder="Ex: Roadmap Q4 Logitrack" required autocomplete="off">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-close-modal="modal-board">Annuler</button>
          <button type="submit" class="btn btn-primary">Créer le tableau</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 2. Modale Ajout / Renommage de Colonne -->
  <div id="modal-column" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-column-heading">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="modal-column-heading">Ajouter une colonne</h3>
        <button type="button" class="btn-close" data-close-modal="modal-column" aria-label="Fermer la boîte de dialogue">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <form id="form-column">
        <div class="modal-body">
          <div class="form-group">
            <label for="column-modal-title">Nom de la colonne</label>
            <input type="text" id="column-modal-title" class="form-input" placeholder="Ex: En cours, En revue, Terminé..." required autocomplete="off">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-close-modal="modal-column">Annuler</button>
          <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 3. Modale Ajout / Édition de Carte -->
  <div id="modal-card" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-card-heading">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="modal-card-heading">Ajouter une nouvelle tâche</h3>
        <button type="button" class="btn-close" data-close-modal="modal-card" aria-label="Fermer la boîte de dialogue">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <form id="form-card">
        <div class="modal-body">
          <div class="form-group">
            <label for="card-modal-title">Titre de la tâche</label>
            <input type="text" id="card-modal-title" class="form-input" placeholder="Ex: Corriger le bug du middleware JWT" required autocomplete="off">
          </div>
          <div class="form-group">
            <label for="card-modal-desc">Description (optionnelle)</label>
            <textarea id="card-modal-desc" class="form-textarea" rows="4" placeholder="Détails techniques, étapes de reproduction, critères d'acceptation..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-close-modal="modal-card">Annuler</button>
          <button type="submit" class="btn btn-primary">Enregistrer la tâche</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 4. Modale de Confirmation de Suppression -->
  <div id="modal-confirm" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-confirm-title">
    <div class="modal-dialog modal-dialog-sm">
      <div class="modal-header">
        <h3 id="modal-confirm-title">Confirmation</h3>
        <button type="button" class="btn-close" data-close-modal="modal-confirm" aria-label="Fermer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <p id="modal-confirm-message" class="confirm-message">Êtes-vous sûr de vouloir supprimer cet élément ?</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-close-modal="modal-confirm">Annuler</button>
        <button type="button" class="btn btn-danger" id="modal-confirm-btn">Supprimer définitivement</button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- Script ES Module -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
